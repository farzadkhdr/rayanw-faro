<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بۆ رەیانەکەم</title>
    <!-- فۆنتی کوردیی وەزیرمتن -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* وێنەی پاشبنەما (باکگراوەند) */
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('https://raw.githubusercontent.com/farzadkhdr/rayanw-faro/main/IMG_0486.jpeg') no-repeat center center/cover;
            overflow: hidden;
            cursor: pointer;
            padding: 12px;
        }

        .container {
            text-align: center;
            color: #ffffff;
            padding: 16px 14px;
            max-width: 380px;
            width: 100%;
            max-height: 90vh;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* دەقی دەستپێک پێش کلیک کردن */
        .click-hint {
            font-size: 1.1rem;
            font-weight: 600;
            animation: pulse 1.5s infinite;
            padding: 20px 10px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.04); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* ناوەڕۆکی شاردراوە کە لەگەڵ کلیک دەردەکەوێت */
        .content {
            display: none;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            width: 100%;
        }

        .content.show {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 1;
            transform: translateY(0);
        }

        /* وێنەی ناوەوە بە قەبارەی گونجاو بۆ مۆبایل */
        .revealed-img {
            width: 100%;
            max-width: 210px;
            max-height: 38vh;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
            margin-bottom: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
        }

        /* دەقی ئاشقانە بە قەبارەی بچووکتر و گونجاو */
        .love-text {
            font-size: 0.92rem;
            line-height: 1.6;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            font-weight: 400;
            margin-top: 4px;
        }

        .love-text b {
            color: #ffe6eb;
            font-size: 1rem;
        }

        .heart {
            color: #ff4b2b;
            font-size: 1.2rem;
            display: inline-block;
            margin-top: 6px;
        }

        /* شاردنەوەی تەواوەتی ڤیدیۆ تا تەنها دەنگەکەی کار بکات */
        .hidden-audio {
            position: absolute;
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- دەقی سەرەتایی -->
        <div class="click-hint" id="hintText">
            کلیک بکە بۆ کردنەوەی پەڕەکە... ❤️
        </div>

        <!-- ناوەڕۆکی دوای کلیک -->
        <div class="content" id="secretContent">
            <!-- وێنەی دووەم -->
            <img src="https://raw.githubusercontent.com/farzadkhdr/rayanw-faro/main/IMG_0482.jpeg" alt="رەیان" class="revealed-img">
            
            <!-- نوسینی ئاشقانە -->
            <p class="love-text">
                تۆ جوانترین دیاری بەخشراوی ژیانمی، <b>رەیان</b>ەکەم..<br>
                لەگەڵ هەر لێدانێکی دڵم، خۆشەویستیت قووڵتر دەبێتەوە.<br>
                ماڵێک لە ئەڤینت لە ناخما دروست بووە کە هیچ سۆزێک جێی ناگرێتەوە. ✨
            </p>
            <span class="heart">❤️</span>
        </div>
    </div>

    <!-- فایلی دەنگ (ڤیدیۆکە شاردراوەتەوە) -->
    <video id="audioPlayer" class="hidden-audio" playsinline preload="auto">
        <source src="https://raw.githubusercontent.com/farzadkhdr/rayanw-faro/main/v14044g50000da3ihffog65vu3vpufn0.mov" type="video/quicktime">
        <source src="https://raw.githubusercontent.com/farzadkhdr/rayanw-faro/main/v14044g50000da3ihffog65vu3vpufn0.mov" type="video/mp4">
    </video>

    <script>
        const body = document.body;
        const audio = document.getElementById('audioPlayer');
        const hintText = document.getElementById('hintText');
        const secretContent = document.getElementById('secretContent');
        let isPlayed = false;

        body.addEventListener('click', () => {
            if (!isPlayed) {
                // لێدانی دەنگ لە پاشبنەما
                audio.play().catch(error => console.log("کارپێکردنی دەنگ سەرکەوتوو نەبوو: ", error));
                
                // شاردنەوەی ئاگاداری و پیشاندانی وێنە و دەقەکە
                hintText.style.display = 'none';
                secretContent.classList.add('show');
                
                isPlayed = true;
            }
        });
    </script>
</body>
</html>
